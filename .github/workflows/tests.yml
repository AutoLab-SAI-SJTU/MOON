name: Inference checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pillow==11.3.0 scipy==1.15.3 transformers==5.15.0 peft==0.20.0 pytest==9.1.1 build==1.3.0 PyYAML==6.0.3
          python -m pip install -e . --no-deps
      - name: Check scripts and inference behavior
        run: |
          bash -n scripts/launch/env.sh
          bash -n scripts/launch/eval.sh
          python scripts/run_harness_eval.py --help
          python scripts/check_setup.py --help
          python -m pytest tests -q
      - name: Build inference package
        run: python -m build --no-isolation
